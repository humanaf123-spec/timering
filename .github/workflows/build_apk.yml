name: Build Timering APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure Android project files exist
        run: flutter create --platforms=android --org com.humaid --project-name timering .

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android SDK 35, minSdk 23, NDK, and Kotlin 1.9.24
        run: |
          python3 -c '
          from pathlib import Path
          import re

          for p in Path("android/app").glob("build.gradle*"):
              txt = p.read_text()
              txt = re.sub(r"compileSdk\s*=?\s*(?:flutter\.compileSdkVersion|\d+)", "compileSdk = 35", txt)
              txt = re.sub(r"compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)", "compileSdkVersion 35", txt)
              txt = re.sub(r"targetSdk\s*=?\s*(?:flutter\.targetSdkVersion|\d+)", "targetSdk = 35", txt)
              txt = re.sub(r"targetSdkVersion\s+(?:flutter\.targetSdkVersion|\d+)", "targetSdkVersion 35", txt)

              txt = re.sub(r"ndkVersion\s*=?\s*[\"'\'']?flutter\.ndkVersion[\"'\'']?", "ndkVersion = \"25.1.8937393\"", txt)
              txt = re.sub(r"ndkVersion\s+[\"'\'']?flutter\.ndkVersion[\"'\'']?", "ndkVersion \"25.1.8937393\"", txt)

              if re.search(r"\bminSdk\b", txt):
                  txt = re.sub(r"\bminSdk\s*=?\s*[^\s\r\n]+", "minSdk = 23", txt)
              elif re.search(r"\bminSdkVersion\b", txt):
                  txt = re.sub(r"\bminSdkVersion\s+[^\s\r\n]+", "minSdkVersion 23", txt)
              else:
                  txt = re.sub(
                      r"(defaultConfig\s*\{)",
                      r"\1\n        minSdk = 23",
                      txt,
                      count=1,
                  )

              p.write_text(txt)

          for p in [Path("android/build.gradle"), Path("android/build.gradle.kts"), Path("android/settings.gradle"), Path("android/settings.gradle.kts")]:
              if p.exists():
                  txt = p.read_text()
                  txt = re.sub(r"(ext\.kotlin_version\s*=\s*)[\"'\''][^\"'\'']+[\"'\'']", r"\1\"1.9.24\"", txt)
                  txt = re.sub(r"(id\s*\(?[\"'\'']org\.jetbrains\.kotlin\.android[\"'\'']\)?\s+version\s+)[\"'\''][^\"'\'']+[\"'\'']", r"\1\"1.9.24\"", txt)
                  txt = re.sub(r"(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[\"'\'']?[^\"'\'']+[\"'\'']?", r"\g<1>1.9.24", txt)
                  p.write_text(txt)
          '

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: timering-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
