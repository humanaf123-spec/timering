name: Build Timering APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure Android project files exist
        run: flutter create --platforms=android --org com.humaid --project-name timering .

      - name: Update Android SDK and NDK versions
        run: |
          python3 -c '
          from pathlib import Path
          for p in Path("android/app").glob("build.gradle*"):
              txt = p.read_text()
              txt = txt.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 35")
              txt = txt.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 35")
              txt = txt.replace("ndkVersion = flutter.ndkVersion", "ndkVersion = \"25.1.8937393\"")
              txt = txt.replace("ndkVersion flutter.ndkVersion", "ndkVersion \"25.1.8937393\"")
              p.write_text(txt)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: timering-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
