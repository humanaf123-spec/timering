name: timering
description: Smart Once-Only Alarm, Auto SMS/Call, WhatsApp 1-Tap & Multi-Page Study/Life Planner.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  telephony: ^0.2.0
  flutter_phone_direct_caller: ^2.1.1
  url_launcher: ^6.3.0
  syncfusion_flutter_pdfviewer: ^26.2.14
  file_picker: ^8.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
